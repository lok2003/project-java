# ── Server ──────────────────────────────────────────────
server.port=8080

# ── Application ─────────────────────────────────────────
spring.application.name=webapp

# ── Thymeleaf ───────────────────────────────────────────
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ── Logging ─────────────────────────────────────────────
logging.level.com.example=DEBUG
